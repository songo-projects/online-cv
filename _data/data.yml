career-profile:
  title: Career Profile
  summary: |
    I'm an enthusiastic, self-driven IT enthusiast with a lifelong passion 
    for technology, from building my first PC to independently designing 
    and deploying enterprise-grade network infrastructure for a real business. 
    I thrive on curiosity, constantly teaching myself new skills through 
    hands-on projects, research, and experimentation. Currently pursuing a Bachelor 
    of Science in Computing and Software Systems at the University of Melbourne, 
    I'm building a strong technical foundation while working toward a 
    future career in software engineering, AI, and cybersecurity. I aim to
    bring genuine enthusiasm and a refusal to stop learning to everything I do.
    
education:
  title: Education
  info:
  - degree: Bachelor of Science
    university: The University of Melbourne
    time: FEB 2026 - PRESENT
    details: |
      I'm currently studying a Bachelor of Science majoring in Computing and 
      Software Systems at the University of Melbourne, building a strong 
      foundation in programming, computational thinking, and software development.
      Beyond my degree, I plan to pursue a Master of Software Engineering, 
      specialising in either Artificial Intelligence or Cybersecurity, to 
      deepen my technical expertise in these emerging fields. Completed subjects include:

        - Foundations of Computing - Python programming, computational thinking,
        UTF encoding, numbering systems, and algorithm types, plus exposure to HTML,
        GitHub Copilot, and project-based development

        - Calculus 1 - differentiation, integration, and mathematical modelling to 
        solve real-world quantitative problems

        - Principles of Marketing - gaining an understanding of consumer 
        behaviour, market research, branding, and strategic marketing concepts
        
  - degree: Victorian Certificate of Education (VCE)
    university: Kew High School
    time: JAN 2020 - NOV 2025
    details: |
      Throughout my VCE at Kew High School, I developed leadership, communication, and 
      teamwork skills while expressing creativity across classes. Completing subjects 
      including Core English, Methods, General Mathematics, Physics, Business Management,
      and Applied Computing.
      
        - Developed a Python and Anvil web application to analyse sleep patterns by 
        designing, conducting, and evaluating survey data on human needs, sleep schedules,
        and sleep conditions
        
        - Built and programmed LEGO Mindstorms robots using Blockly for robotics and 
        automation projects.

        - Received a Certificate of Achievement for camera operation at Presentation 
        Night for three consecutive years (2021–2023)
        
experiences:
  title: Experiences
  info:
  - role: IT Support Technician (Work Experience)
    time: Jun 2023 - Jun 2023
    company: A2Z Infrastructure Solutions
    details: |
      Work experience at A2Z Infrastructure Solutions helped me gain my first real exposure
      to the world of IT support, building an understanding of helpdesk operations, IT policy,
      and networking infrastructure. This placement also introduced me to Active Directory,
      Microsoft 365 administration, and cybersecurity practices, sparking my interest in pursuing a career in IT. 
      
        - Learned helpdesk operations, ticketing/online support forms, and IT policy fundamentals
        
        - Gained knowledge of networking: VPN, SD-WAN, DHCP, Wi-Fi, IP addressing, DNS, VLANs, firewalls
        
        - Assisted with Active Directory tasks: creating/disabling user accounts, group policies, joining laptops to domain
        
        - Exposed to remote desktop support tools for troubleshooting end-user issues
        
        - Supported Microsoft 365 admin tasks: mailbox management, Outlook/email access, PST export
        
        - Participated in cybersecurity discussions: firewall setup, activity monitoring, business security requirements

projects:
  title: Projects
  intro: >
   🔍 Click a project title to view images.
  assignments:
  - title: UDM-Pro and APs Deployment (Summer Project)
    link: "https://raw.githubusercontent.com/songo-projects/online-cv/refs/heads/master/_data/Ubiquiti.png"
    tagline: |
      Independently led and self-managed the end-to-end deployment, conducting a comprehensive site assessment and network design tailored to business scale and operational needs.
  
        - Performed full hardware installation CAT6 cabling, RJ45 termination, rack-mounted servers/switches, AP deployment
        - Configured software WAN, VLANs, firewall/traffic rules, SSID/channel planning, DHCP reservations
        - Delivered performance reporting with IoT isolation
        - Set up VPN for management access
    
  - title: Synology NAS Deployment (Summer Project)
    link: "https://raw.githubusercontent.com/songo-projects/online-cv/refs/heads/master/_data/Synology%20NAS.png"
    tagline: |
      Independently led and self-managed the end-to-end deployment, conducting a comprehensive site assessment and network design tailored to business scale and operational needs.
  
        - Performed full hardware installation: NAS deployment, HDDs, SSD cache, and RAM upgrades
        - Configured software: User accounts and permission, group policies, set up shared folders, cloud and backup services
        - Deployed and configured client software on employee laptops for file access
        - Configured cloud sync and automated backup services

  - title: TP-Link Wi-Fi 7 Deployment (Summer Project)
    link: "https://raw.githubusercontent.com/songo-projects/online-cv/refs/heads/master/_data/TP-Link.png"
    tagline: |
      Assessing office's existing network infrastucture and research solutions to achieve extremely high-speed internet performance
  
        - Configured main router settings including WAN, Wi-Fi, DHCP, and IP reservations
        - Performed Ethernet cable wiring for switches and LAN devices, and deployed APs and switches for full Wi-Fi coverage
        - Conducted speed testing at the main router (multi-gig speeds) and at access points (gigabit speeds) to validate performance
    
  - title: Surveillance System Deployment (Summer Project)
    link: "https://raw.githubusercontent.com/songo-projects/online-cv/refs/heads/master/_data/Surveillance%20System.png"
    tagline: |
      Deployment of both DVR (Analog) and NVR (IP) camera systems for a factory site
  
        - Conducted on-site wiring, Ethernet cabling, and camera installation
        - Set up DVR, screen monitoring, and app-based viewing access for the management team
        - Installed Smart IP cameras and adopted them into the NVR and app, ensuring proper VLAN network segmentation
    
  - title: Personal Home Lab (Home Assistant, Windows Server, Synology NAS)
    link: "https://raw.githubusercontent.com/songo-projects/online-cv/refs/heads/master/_data/Personal%20Home%20Lab.png"
    tagline: |
      Built and maintain a personal home lab driven by a lifelong passion for IT, self-taught through independent research and video tutorials
  
        - Deployed Windows Server to replicate enterprise environments, including Active Directory-style policies used in business and school networks
        - Configured Home Assistant to centralize and automate smart home devices, including testing and implementing new devices and software configurations
        - Currently expanding knowledge of Active Directory for corporate/enterprise applications, with plans to apply this in an upcoming summer project
        - Planning future implementation of UniFi networking and Pi-hole for DNS-level ad blocking and network management, to further build hands-on experience

